name: Build T527 AWNN runtime

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Runtime wheel version
        required: true
        default: "1.1.0rc15"

permissions:
  contents: read

jobs:
  build-cpu-fallback:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90

    steps:
      - name: Check out PiNozCam
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake git python3-venv

      - name: Build the AArch64 CPU fallback
        run: |
          src/executorch/bootstrap_aarch64_cpu.sh \
            "$RUNNER_TEMP/pinozcam-aarch64-build" \
            "$GITHUB_WORKSPACE/runtime-artifacts"

      - name: Upload CPU fallback for the T527 job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t527-cpu-fallback-${{ github.sha }}
          path: runtime-artifacts/bin/nozcam_daemon.aarch64.static
          if-no-files-found: error
          retention-days: 1

  build-t527-runtime:
    needs: build-cpu-fallback
    runs-on: ubuntu-22.04-arm
    # Ubuntu 20.04 (glibc 2.31, gcc 9), the same pinned image the A733 job
    # uses. The build host sets the daemon's glibc floor: gcc 13 on glibc 2.39
    # emits __libc_start_main@GLIBC_2.34 and produces a binary that will not
    # load on the boards, which run 2.36 and older.
    container:
      image: ubuntu@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
    timeout-minutes: 120
    env:
      # The same vendor SDK the A733 job pins; it carries both VIPLite major
      # versions, so only the subdirectory differs between the two targets.
      AI_SDK_REPOSITORY: https://github.com/ZIFENG278/ai-sdk.git
      AI_SDK_COMMIT: fc90006d0f6569da2f6726c2d8395877686f5aca
      # Models come from the Hugging Face model repository, pinned to a
      # commit. A commit SHA is immutable, unlike a release asset or a tag.
      HF_REPO: DrAlexLiu/PiNozCam
      HF_REVISION: cfac74f19ed6ba537d138a047a1f547893123be1
      CPU_MODEL_SHA256: 1057e47d5341bec038f9f7ccdacd3b01ff6b8eb196a7ae72d3e263d7df013221
      AWNN_MODEL_SHA256: a797e027656a163da8f72eb2cdf10e28d021d74e136d853d9b39715747433d31
      AWNN_SDK_DIR: ${{ github.workspace }}/vendor/ai-sdk/examples/libawnn_viplite
      VIP_INCLUDE_DIR: ${{ github.workspace }}/vendor/ai-sdk/viplite-tina/lib/aarch64-none-linux-gnu/v1.13/inc
      VIP_LIB_DIR: ${{ github.workspace }}/vendor/ai-sdk/viplite-tina/lib/aarch64-none-linux-gnu/v1.13
      # VIPLite v1.13 names its runtime differently from v2.0. The awnn_* API
      # above them is identical, so the daemon source is shared and only the
      # link names change.
      VIP_LIBS: VIPlite VIPuser
      VIP_RUNTIME_LIB_DIR: /usr/local/lib
      PACKAGE_PYTHON: python3
      VERSION: ${{ inputs.version }}

    steps:
      - name: Install hosted build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            --no-install-recommends \
            ca-certificates curl file g++ gcc git python3 python3-venv unzip

      - name: Check out PiNozCam
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the CPU fallback
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: t527-cpu-fallback-${{ github.sha }}
          path: runtime-artifacts/bin

      - name: Fetch the pinned public SDK inputs
        run: |
          mkdir -p vendor/ai-sdk
          git -C vendor/ai-sdk init
          git -C vendor/ai-sdk remote add origin "$AI_SDK_REPOSITORY"
          git -C vendor/ai-sdk fetch --depth=1 origin "$AI_SDK_COMMIT"
          git -C vendor/ai-sdk checkout --detach FETCH_HEAD
          test "$(git -C vendor/ai-sdk rev-parse HEAD)" = "$AI_SDK_COMMIT"

      - name: Fetch pinned model inputs
        # Two independent checks per file. x-repo-commit proves the fetch
        # resolved to the intended commit; the digest proves the bytes.
        # The header is only present on huggingface.co's own 307 -- following
        # the redirect lands on a CDN response that does not carry it -- so
        # it is read without --location, and the download is a second call.
        run: |
          mkdir -p runtime-artifacts/models
          base="https://huggingface.co/$HF_REPO/resolve/$HF_REVISION"
          fetch_pinned() {
            remote=$1
            local_name=$2
            expected=$3
            # No --retry-all-errors: this pinned container is Ubuntu 20.04,
            # whose curl 7.68 predates that option (added in 7.71) and exits
            # with "option is unknown" rather than ignoring it.
            commit=$(curl --fail --silent --show-error --head \
              --retry 5 "$base/$remote" \
              | tr -d '\r' | awk 'tolower($1) == "x-repo-commit:" {print $2}')
            if [ "$commit" != "$HF_REVISION" ]; then
              echo "$remote resolved to commit '$commit', expected $HF_REVISION"
              exit 1
            fi
            curl --fail --silent --show-error --location --retry 5 \
              --output "runtime-artifacts/models/$local_name" "$base/$remote"
            echo "$expected  runtime-artifacts/models/$local_name" \
              | sha256sum --check
          }
          fetch_pinned cpu/nozcam-cpu.pte nozcam-cpu.pte "$CPU_MODEL_SHA256"
          fetch_pinned npu/nozcam-t527.nb nozcam-t527.nb "$AWNN_MODEL_SHA256"

      - name: Validate hosted build inputs
        run: |
          if [ ! -d "$AWNN_SDK_DIR" ]; then
            echo "AWNN SDK path is missing: $AWNN_SDK_DIR"
            exit 1
          fi
          if [ ! -d "$VIP_LIB_DIR" ]; then
            echo "VIPLite v1.13 path is missing: $VIP_LIB_DIR"
            exit 1
          fi
          if [ ! -f src/runtime/package_accelerator_runtime.py ]; then
            echo "Common packager missing: src/runtime/package_accelerator_runtime.py"
            exit 1
          fi

      - name: Build daemon + package T527 runtime
        env:
          ARTIFACT_ROOT: runtime-artifacts
        run: |
          chmod +x src/allwinner/build.sh
          "$PACKAGE_PYTHON" -m venv "$RUNNER_TEMP/package-venv"
          "$RUNNER_TEMP/package-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            'packaging==24.2' 'setuptools==75.3.2' 'wheel==0.45.1'
          OUT=runtime-artifacts/bin/nozcam_daemon.awnn113.aarch64 \
          OBJ_DIR=runtime-artifacts/.build \
            src/allwinner/build.sh
          "$RUNNER_TEMP/package-venv/bin/python" \
            src/runtime/package_accelerator_runtime.py \
            --target awnnt527 \
            --artifact-root runtime-artifacts \
            --output dist \
            --version "$VERSION" \
            --revision "$GITHUB_SHA"

      - name: Verify daemon and wheel payload
        run: |
          daemon=runtime-artifacts/bin/nozcam_daemon.awnn113.aarch64
          file "$daemon"
          max_glibc=$(readelf --version-info "$daemon" \
            | grep -Eo 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' \
            | sort -Vu | tail -n 1)
          if [ "$(printf '%s\n' "$max_glibc" 2.29 | sort -V | tail -n 1)" != 2.29 ]; then
            echo "T527 daemon requires GLIBC_$max_glibc, above the 2.29 build ceiling"
            exit 1
          fi
          readelf --dynamic "$daemon" > "$RUNNER_TEMP/t527.dynamic"
          grep -F 'Shared library: [libVIPlite.so]' "$RUNNER_TEMP/t527.dynamic"
          readelf --dynamic "$VIP_LIB_DIR/libVIPlite.so" \
            | grep -F 'Shared library: [libVIPuser.so]'
          # A v2.0 library name here would mean the wrong SDK subdirectory was
          # used, which no other check would catch until the board rejects it.
          if grep -E 'Shared library: \[lib(NBGlinker|VIPhal)\.so\]' \
              "$RUNNER_TEMP/t527.dynamic"; then
            echo "T527 daemon links the v2.0 runtime, expected v1.13"
            exit 1
          fi
          grep -E '(RPATH|RUNPATH).*/usr/local/lib' "$RUNNER_TEMP/t527.dynamic"
          if grep -F "$RUNNER_TEMP" "$RUNNER_TEMP/t527.dynamic"; then
            echo "T527 daemon records an ephemeral CI library path"
            exit 1
          fi
          LD_LIBRARY_PATH="$VIP_LIB_DIR" ldd "$daemon" \
            > "$RUNNER_TEMP/t527.ldd"
          if grep -F 'not found' "$RUNNER_TEMP/t527.ldd"; then
            cat "$RUNNER_TEMP/t527.ldd"
            exit 1
          fi
          file dist/*.whl
          "$RUNNER_TEMP/package-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-deps \
            --target "$RUNNER_TEMP/wheel-install" dist/*.whl
          module="$RUNNER_TEMP/wheel-install/pinozcam_runtime_t527"
          test -x "$module/bin/nozcam_daemon.aarch64.static"
          test -x "$module/bin/nozcam_daemon.awnn113.aarch64"
          test -f "$module/models/nozcam-cpu.pte"
          test -f "$module/models/nozcam-t527.nb"
          "$RUNNER_TEMP/package-venv/bin/python" \
            src/runtime/verify_runtime_wheel.py \
            --target awnnt527 --wheel dist/*.whl --revision "$GITHUB_SHA"
          # Only the CPU fallback can run here; the NPU daemon needs a T527.
          "$PACKAGE_PYTHON" src/executorch/smoke_test.py \
            --daemon "$module/bin/nozcam_daemon.aarch64.static" \
            --model "$module/models/nozcam-cpu.pte" --timeout 900
          if unzip -l dist/*.whl | grep -E 'lib(VIPlite|VIPuser)\.so'; then
            echo "T527 Wheel must not bundle board runtime libraries"
            exit 1
          fi
          test -f dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pinozcam-runtime-t527-${{ github.sha }}
          path: |
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
