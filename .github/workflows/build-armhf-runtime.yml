name: Build ARMHF CPU runtime

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Runtime Wheel version
        required: true
        default: "1.1.0rc12"
        type: string

permissions:
  contents: read

concurrency:
  group: build-armhf-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # Model inputs come from the Hugging Face model repository,
      # pinned to a commit. A commit SHA is immutable; a release
      # asset can be replaced under an unchanged tag.
      HF_BASE: https://huggingface.co/DrAlexLiu/PiNozCam/resolve/cfac74f19ed6ba537d138a047a1f547893123be1
      HF_REVISION: cfac74f19ed6ba537d138a047a1f547893123be1
      MODEL_SHA256: 1057e47d5341bec038f9f7ccdacd3b01ff6b8eb196a7ae72d3e263d7df013221

    steps:
      - name: Check out PiNozCam
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install cross-build and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            binutils-arm-linux-gnueabihf \
            crossbuild-essential-armhf \
            file \
            git \
            python3-venv \
            qemu-user \
            unzip

      - name: Build the ARMHF daemon from source
        run: |
          bash src/executorch/bootstrap_armhf_cpu.sh \
            "$RUNNER_TEMP/pinozcam-armhf-build" \
            "$GITHUB_WORKSPACE/runtime-artifacts"

      - name: Fetch pinned model inputs
        # Pinned to a commit in the model repository: a commit SHA
        # is immutable, where a release asset can be replaced under
        # an unchanged tag. x-repo-commit is read without --location
        # because only huggingface.co's own 307 carries it.
        run: |
          mkdir -p runtime-artifacts/models
          base="https://huggingface.co/DrAlexLiu/PiNozCam/resolve/cfac74f19ed6ba537d138a047a1f547893123be1"
          fetch_pinned() {
            remote=$1
            expected=$2
            local_name=${remote##*/}
            commit=$(curl --fail --silent --show-error --head \
              --retry 5 --retry-all-errors "$base/$remote" \
              | tr -d '\r' | awk 'tolower($1) == "x-repo-commit:" {print $2}')
            if [ "$commit" != "cfac74f19ed6ba537d138a047a1f547893123be1" ]; then
              echo "$remote resolved to commit '$commit', expected cfac74f19ed6ba537d138a047a1f547893123be1"
              exit 1
            fi
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors \
              --output "runtime-artifacts/models/$local_name" "$base/$remote"
            echo "$expected  runtime-artifacts/models/$local_name" \
              | sha256sum --check
          }
          fetch_pinned cpu/nozcam-cpu.pte "1057e47d5341bec038f9f7ccdacd3b01ff6b8eb196a7ae72d3e263d7df013221"

      - name: Build and audit the ARMHF Wheel
        run: |
          python3 -m venv "$RUNNER_TEMP/runtime-package-venv"
          runtime_python="$RUNNER_TEMP/runtime-package-venv/bin/python"
          "$runtime_python" -m pip install --disable-pip-version-check \
            'auditwheel==6.4.2' 'setuptools==75.3.2' 'wheel==0.45.1'
          "$runtime_python" src/runtime/package_cpu_runtime.py \
            --target armhf \
            --artifact-root runtime-artifacts \
            --output dist \
            --version "${{ inputs.version }}" \
            --revision "$GITHUB_SHA"
          "$runtime_python" src/runtime/check_manylinux.py \
            --architecture armv7l --max-glibc-minor 17 dist/*.whl
          echo "RUNTIME_PYTHON=$runtime_python" >> "$GITHUB_ENV"

      - name: Exercise the installed Wheel through QEMU
        run: |
          "$RUNTIME_PYTHON" -m pip install --disable-pip-version-check --no-deps \
            --only-binary=:all: --platform manylinux2014_armv7l \
            --target "$RUNNER_TEMP/wheel-install" dist/*.whl
          module="$RUNNER_TEMP/wheel-install/pinozcam_runner"
          test -x "$module/bin/nozcam_daemon.armhf.static"
          test -f "$module/models/nozcam-cpu.pte"
          "$RUNTIME_PYTHON" src/executorch/smoke_test.py \
            --launcher qemu-arm \
            --daemon "$module/bin/nozcam_daemon.armhf.static" \
            --model "$module/models/nozcam-cpu.pte" \
            --timeout 1200
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload the verified runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pinozcam-runner-armhf-${{ github.sha }}
          path: |
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
