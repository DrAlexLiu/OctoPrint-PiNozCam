name: Build A733 AWNN runtime

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Runtime wheel version
        required: true
        default: "1.1.0rc11"

permissions:
  contents: read

jobs:
  build-cpu-fallback:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90

    steps:
      - name: Check out PiNozCam
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake git python3-venv

      - name: Build the AArch64 CPU fallback
        run: |
          src/executorch/bootstrap_aarch64_cpu.sh \
            "$RUNNER_TEMP/pinozcam-aarch64-build" \
            "$GITHUB_WORKSPACE/runtime-artifacts"

      - name: Upload CPU fallback for the A733 job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a733-cpu-fallback-${{ github.sha }}
          path: runtime-artifacts/bin/nozcam_daemon.aarch64.static
          if-no-files-found: error
          retention-days: 1

  build-a733-runtime:
    needs: build-cpu-fallback
    runs-on: ubuntu-22.04-arm
    container:
      image: ubuntu@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
    timeout-minutes: 120
    env:
      AI_SDK_REPOSITORY: https://github.com/ZIFENG278/ai-sdk.git
      AI_SDK_COMMIT: fc90006d0f6569da2f6726c2d8395877686f5aca
      MODEL_WHEEL_URL: https://github.com/DrAlexLiu/OctoPrint-PiNozCam/releases/download/1.1.0rc5/pinozcam_runtime_a733-1.1.0rc5-py3-none-manylinux_2_29_aarch64.whl
      MODEL_WHEEL_SHA256: 6fe4ef17b71be17c512bf3d993a6751898bc697d1bf093aae8a1f40c45840907
      CPU_MODEL_SHA256: 1057e47d5341bec038f9f7ccdacd3b01ff6b8eb196a7ae72d3e263d7df013221
      AWNN_MODEL_SHA256: 0000bb6d454ee6d3f80e5b13df8a2622e800444a769f6a744db39c47a7a90334
      AWNN_SDK_DIR: ${{ github.workspace }}/vendor/ai-sdk/examples/libawnn_viplite
      VIP_INCLUDE_DIR: ${{ github.workspace }}/vendor/ai-sdk/viplite-tina/lib/aarch64-none-linux-gnu/v2.0/inc
      VIP_LIB_DIR: ${{ github.workspace }}/vendor/ai-sdk/viplite-tina/lib/aarch64-none-linux-gnu/v2.0
      VIP_RUNTIME_LIB_DIR: /usr/local/lib
      PACKAGE_PYTHON: python3
      VERSION: ${{ inputs.version }}

    steps:
      - name: Install hosted build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            --no-install-recommends \
            ca-certificates curl file g++ gcc git python3 python3-venv unzip

      - name: Check out PiNozCam
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the CPU fallback
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: a733-cpu-fallback-${{ github.sha }}
          path: runtime-artifacts/bin

      - name: Fetch the pinned public A733 SDK inputs
        run: |
          mkdir -p vendor/ai-sdk
          git -C vendor/ai-sdk init
          git -C vendor/ai-sdk remote add origin "$AI_SDK_REPOSITORY"
          git -C vendor/ai-sdk fetch --depth=1 origin "$AI_SDK_COMMIT"
          git -C vendor/ai-sdk checkout --detach FETCH_HEAD
          test "$(git -C vendor/ai-sdk rev-parse HEAD)" = "$AI_SDK_COMMIT"

      - name: Fetch pinned model inputs
        run: |
          mkdir -p runtime-artifacts/models
          curl --fail --location --retry 5 \
            --output "$RUNNER_TEMP/model-source.whl" "$MODEL_WHEEL_URL"
          echo "$MODEL_WHEEL_SHA256  $RUNNER_TEMP/model-source.whl" \
            | sha256sum --check
          python3 - "$RUNNER_TEMP/model-source.whl" runtime-artifacts/models <<'PY'
          import os
          import sys
          import zipfile

          wheel, output = sys.argv[1:]
          wanted = {"nozcam-a733.nb", "nozcam-cpu.pte"}
          with zipfile.ZipFile(wheel) as archive:
              members = {
                  os.path.basename(name): name
                  for name in archive.namelist()
                  if "/models/" in name and os.path.basename(name) in wanted
              }
              if set(members) != wanted:
                  raise SystemExit("pinned Wheel has the wrong model set")
              for filename, member in members.items():
                  with open(os.path.join(output, filename), "wb") as handle:
                      handle.write(archive.read(member))
          PY
          echo "$CPU_MODEL_SHA256  runtime-artifacts/models/nozcam-cpu.pte" \
            | sha256sum --check
          echo "$AWNN_MODEL_SHA256  runtime-artifacts/models/nozcam-a733.nb" \
            | sha256sum --check

      - name: Validate hosted build inputs
        run: |
          if [ ! -d "$AWNN_SDK_DIR" ]; then
            echo "AWNN SDK path is missing: $AWNN_SDK_DIR"
            exit 1
          fi
          if [ ! -f src/runtime/package_accelerator_runtime.py ]; then
            echo "Common packager missing: src/runtime/package_accelerator_runtime.py"
            exit 1
          fi

      - name: Build daemon + package AWNN runtime
        env:
          ARTIFACT_ROOT: runtime-artifacts
        run: |
          chmod +x src/allwinner/bootstrap_ci.sh
          "$PACKAGE_PYTHON" -m venv "$RUNNER_TEMP/package-venv"
          "$RUNNER_TEMP/package-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            'packaging==24.2' 'setuptools==75.3.2' 'wheel==0.45.1'
          version="$VERSION"
          src/allwinner/bootstrap_ci.sh
          "$RUNNER_TEMP/package-venv/bin/python" \
            src/runtime/package_accelerator_runtime.py \
            --target awnn \
            --artifact-root runtime-artifacts \
            --output dist \
            --version "$version" \
            --revision "$GITHUB_SHA"

      - name: Verify daemon and wheel payload
        run: |
          file runtime-artifacts/bin/nozcam_daemon.awnn.aarch64
          max_glibc=$(readelf --version-info \
            runtime-artifacts/bin/nozcam_daemon.awnn.aarch64 \
            | grep -Eo 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' \
            | sort -Vu | tail -n 1)
          if [ "$(printf '%s\n' "$max_glibc" 2.29 | sort -V | tail -n 1)" != 2.29 ]; then
            echo "A733 daemon requires GLIBC_$max_glibc, above the 2.29 build ceiling"
            exit 1
          fi
          readelf --dynamic runtime-artifacts/bin/nozcam_daemon.awnn.aarch64 \
            > "$RUNNER_TEMP/a733.dynamic"
          grep -F 'Shared library: [libNBGlinker.so]' \
            "$RUNNER_TEMP/a733.dynamic"
          readelf --dynamic "$VIP_LIB_DIR/libNBGlinker.so" \
            | grep -F 'Shared library: [libVIPhal.so]'
          grep -E '(RPATH|RUNPATH).*/usr/local/lib' \
            "$RUNNER_TEMP/a733.dynamic"
          if grep -F "$RUNNER_TEMP" "$RUNNER_TEMP/a733.dynamic"; then
            echo "A733 daemon records an ephemeral CI library path"
            exit 1
          fi
          LD_LIBRARY_PATH="$VIP_LIB_DIR" \
            ldd runtime-artifacts/bin/nozcam_daemon.awnn.aarch64 \
            > "$RUNNER_TEMP/a733.ldd"
          if grep -F 'not found' "$RUNNER_TEMP/a733.ldd"; then
            cat "$RUNNER_TEMP/a733.ldd"
            exit 1
          fi
          file dist/*.whl
          "$RUNNER_TEMP/package-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-deps \
            --target "$RUNNER_TEMP/wheel-install" dist/*.whl
          module="$RUNNER_TEMP/wheel-install/pinozcam_runtime_a733"
          test -x "$module/bin/nozcam_daemon.aarch64.static"
          test -x "$module/bin/nozcam_daemon.awnn.aarch64"
          test -f "$module/models/nozcam-cpu.pte"
          test -f "$module/models/nozcam-a733.nb"
          "$RUNNER_TEMP/package-venv/bin/python" \
            src/runtime/verify_runtime_wheel.py \
            --target awnn --wheel dist/*.whl --revision "$GITHUB_SHA"
          "$PACKAGE_PYTHON" src/executorch/smoke_test.py \
            --daemon "$module/bin/nozcam_daemon.aarch64.static" \
            --model "$module/models/nozcam-cpu.pte" --timeout 900
          if unzip -l dist/*.whl \
              | grep -E 'lib(NBGlinker|VIPhal)\.so'; then
            echo "A733 Wheel must not bundle board runtime libraries"
            exit 1
          fi
          test -f dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pinozcam-runtime-a733-${{ github.sha }}
          path: |
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
