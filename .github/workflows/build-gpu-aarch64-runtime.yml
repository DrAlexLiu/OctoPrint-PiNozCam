name: Build AArch64 GPU runtime

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Runtime Wheel version
        required: true
        default: "1.1.0"
        type: string

permissions:
  contents: read

concurrency:
  group: build-gpu-aarch64-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-cpu-fallback:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    env:
      # Model inputs come from the Hugging Face model repository,
      # pinned to a commit. A commit SHA is immutable; a release
      # asset can be replaced under an unchanged tag.
      HF_BASE: https://huggingface.co/DrAlexLiu/PiNozCam/resolve/cfac74f19ed6ba537d138a047a1f547893123be1
      HF_REVISION: cfac74f19ed6ba537d138a047a1f547893123be1
      CPU_MODEL_SHA256: 1057e47d5341bec038f9f7ccdacd3b01ff6b8eb196a7ae72d3e263d7df013221

    steps:
      - name: Check out PiNozCam
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install native CPU build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential cmake curl git python3-venv unzip

      - name: Build and exercise the AArch64 CPU fallback
        run: |
          src/executorch/bootstrap_aarch64_cpu.sh \
            "$RUNNER_TEMP/pinozcam-aarch64-build" \
            "$GITHUB_WORKSPACE/runtime-artifacts"
          mkdir -p runtime-artifacts/models
          url="$HF_BASE/cpu/nozcam-cpu.pte"
          commit=$(curl --fail --silent --show-error --head \
            --retry 5 --retry-all-errors "$url" \
            | tr -d '\r' | awk 'tolower($1) == "x-repo-commit:" {print $2}')
          if [ "$commit" != "$HF_REVISION" ]; then
            echo "model resolved to commit '$commit', expected $HF_REVISION"
            exit 1
          fi
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors \
            --output runtime-artifacts/models/nozcam-cpu.pte "$url"
          echo "$CPU_MODEL_SHA256  runtime-artifacts/models/nozcam-cpu.pte" \
            | sha256sum --check
          python3 src/executorch/smoke_test.py \
            --daemon runtime-artifacts/bin/nozcam_daemon.aarch64.static \
            --model runtime-artifacts/models/nozcam-cpu.pte --timeout 900

      - name: Upload CPU fallback for the Vulkan job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pinozcam-gpu-aarch64-cpu-${{ github.sha }}
          path: runtime-artifacts/bin/nozcam_daemon.aarch64.static
          if-no-files-found: error
          retention-days: 1

  build-vulkan-and-test:
    # Native ARM64 compilation does not require an NVIDIA GPU. Mesa lavapipe
    # exercises the Vulkan path in software; final Orin qualification remains
    # a separate on-device release test.
    needs: build-cpu-fallback
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 180
    env:
      # Model inputs come from the Hugging Face model repository,
      # pinned to a commit. A commit SHA is immutable; a release
      # asset can be replaced under an unchanged tag.
      HF_BASE: https://huggingface.co/DrAlexLiu/PiNozCam/resolve/cfac74f19ed6ba537d138a047a1f547893123be1
      HF_REVISION: cfac74f19ed6ba537d138a047a1f547893123be1
      CPU_MODEL_SHA256: 1057e47d5341bec038f9f7ccdacd3b01ff6b8eb196a7ae72d3e263d7df013221
      GPU_MODEL_SHA256: 9c5f6d5c2f426e128697e03c87e903d052f9be895b0072a9361691b420b1e181

    steps:
      - name: Check out PiNozCam
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the source-built CPU fallback
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pinozcam-gpu-aarch64-cpu-${{ github.sha }}
          path: runtime-artifacts/bin

      - name: Install native build and software Vulkan tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            curl \
            file \
            git \
            mesa-vulkan-drivers \
            python3-venv \
            unzip \
            vulkan-tools

      - name: Fetch pinned model inputs
        # Pinned to a commit in the model repository: a commit SHA
        # is immutable, where a release asset can be replaced under
        # an unchanged tag. x-repo-commit is read without --location
        # because only huggingface.co's own 307 carries it.
        run: |
          mkdir -p runtime-artifacts/models
          base="https://huggingface.co/DrAlexLiu/PiNozCam/resolve/cfac74f19ed6ba537d138a047a1f547893123be1"
          fetch_pinned() {
            remote=$1
            expected=$2
            local_name=${remote##*/}
            commit=$(curl --fail --silent --show-error --head \
              --retry 5 --retry-all-errors "$base/$remote" \
              | tr -d '\r' | awk 'tolower($1) == "x-repo-commit:" {print $2}')
            if [ "$commit" != "cfac74f19ed6ba537d138a047a1f547893123be1" ]; then
              echo "$remote resolved to commit '$commit', expected cfac74f19ed6ba537d138a047a1f547893123be1"
              exit 1
            fi
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors \
              --output "runtime-artifacts/models/$local_name" "$base/$remote"
            echo "$expected  runtime-artifacts/models/$local_name" \
              | sha256sum --check
          }
          fetch_pinned cpu/nozcam-cpu.pte "1057e47d5341bec038f9f7ccdacd3b01ff6b8eb196a7ae72d3e263d7df013221"
          fetch_pinned gpu/nozcam-gpu.pte "9c5f6d5c2f426e128697e03c87e903d052f9be895b0072a9361691b420b1e181"

      - name: Build the AArch64 Vulkan runner from source
        run: |
          chmod 0755 runtime-artifacts/bin/nozcam_daemon.aarch64.static
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          src/executorch/bootstrap_vulkan_aarch64.sh \
            "$RUNNER_TEMP/pinozcam-vulkan-build" \
            "$GITHUB_WORKSPACE/runtime-artifacts"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Audit native ELF payloads
        run: |
          cpu=runtime-artifacts/bin/nozcam_daemon.aarch64.static
          vulkan=runtime-artifacts/bin/nozcam_daemon.vulkan.aarch64
          test -x "$cpu"
          test -x "$vulkan"
          file "$cpu" "$vulkan"
          file "$cpu" | grep -Eq 'ELF 64-bit LSB.*ARM aarch64.*statically linked'
          file "$vulkan" | grep -Eq 'ELF 64-bit LSB.*ARM aarch64.*dynamically linked'
          test "$(readelf -lW "$cpu" | awk '/GNU_STACK/ {print $7; exit}')" = RW
          test "$(readelf -lW "$vulkan" | awk '/GNU_STACK/ {print $7; exit}')" = RW
          if readelf -dW "$cpu" | grep -q NEEDED; then
            echo "CPU fallback unexpectedly has dynamic dependencies" >&2
            exit 1
          fi
          if ldd "$vulkan" | grep -q 'not found'; then
            echo "Vulkan runner has unresolved shared-library dependencies" >&2
            ldd "$vulkan" >&2
            exit 1
          fi
          readelf -dW "$vulkan" | grep NEEDED
          readelf --version-info "$vulkan" \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -Vu

      - name: Build the generic CPU and AArch64 GPU Wheels
        run: |
          python3 -m venv "$RUNNER_TEMP/runtime-package-venv"
          runtime_python="$RUNNER_TEMP/runtime-package-venv/bin/python"
          "$runtime_python" -m pip install --disable-pip-version-check \
            'auditwheel==6.4.2' 'packaging==24.2' \
            'setuptools==75.3.2' 'wheel==0.45.1'
          "$runtime_python" src/runtime/package_cpu_runtime.py \
            --target aarch64 \
            --artifact-root runtime-artifacts \
            --output dist \
            --version "${{ inputs.version }}" \
            --revision "$GITHUB_SHA"
          "$runtime_python" src/runtime/package_accelerator_runtime.py \
            --target vulkan \
            --artifact-root runtime-artifacts \
            --output dist \
            --version "${{ inputs.version }}" \
            --revision "$GITHUB_SHA"
          echo "RUNTIME_PYTHON=$runtime_python" >> "$GITHUB_ENV"

      - name: Verify the installed Wheel and run real PTE inference
        run: |
          shopt -s nullglob
          cpu_wheels=(dist/pinozcam_runtime-*.whl)
          gpu_wheels=(dist/pinozcam_runtime_gpu-*_aarch64.whl)
          test "${#cpu_wheels[@]}" -eq 1
          test "${#gpu_wheels[@]}" -eq 1
          cpu_wheel="${cpu_wheels[0]}"
          gpu_wheel="${gpu_wheels[0]}"
          "$RUNTIME_PYTHON" src/runtime/verify_runtime_wheel.py \
            --target vulkan \
            --wheel "$gpu_wheel" \
            --revision "$GITHUB_SHA"
          "$RUNTIME_PYTHON" src/runtime/check_manylinux.py \
            --architecture aarch64 --max-glibc-minor 17 "$cpu_wheel"
          "$RUNTIME_PYTHON" src/runtime/check_manylinux.py \
            --architecture aarch64 --max-glibc-minor 35 "$gpu_wheel"
          "$RUNTIME_PYTHON" -m pip install --disable-pip-version-check --no-deps \
            --target "$RUNNER_TEMP/wheel-install" "$cpu_wheel" "$gpu_wheel"
          cpu_module="$RUNNER_TEMP/wheel-install/pinozcam_runner"
          module="$RUNNER_TEMP/wheel-install/pinozcam_runner_gpu"
          test -x "$cpu_module/bin/nozcam_daemon.aarch64.static"
          test -f "$cpu_module/models/nozcam-cpu.pte"
          test -x "$module/bin/nozcam_daemon.aarch64.static"
          test -x "$module/bin/nozcam_daemon.vulkan.aarch64"
          test -f "$module/models/nozcam-cpu.pte"
          test -f "$module/models/nozcam-gpu.pte"
          cmp runtime-artifacts/bin/nozcam_daemon.aarch64.static \
            "$module/bin/nozcam_daemon.aarch64.static"
          cmp runtime-artifacts/bin/nozcam_daemon.vulkan.aarch64 \
            "$module/bin/nozcam_daemon.vulkan.aarch64"
          cmp runtime-artifacts/models/nozcam-cpu.pte \
            "$module/models/nozcam-cpu.pte"
          cmp runtime-artifacts/models/nozcam-gpu.pte \
            "$module/models/nozcam-gpu.pte"

          "$RUNTIME_PYTHON" src/executorch/smoke_test.py \
            --daemon "$cpu_module/bin/nozcam_daemon.aarch64.static" \
            --model "$cpu_module/models/nozcam-cpu.pte" \
            --timeout 600

          lavapipe_icd=$(find /usr/share/vulkan/icd.d -maxdepth 1 \
            -type f -name 'lvp_icd*.json' -print -quit)
          test -n "$lavapipe_icd"
          export VK_DRIVER_FILES="$lavapipe_icd"
          export VK_ICD_FILENAMES="$lavapipe_icd"
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 0700 "$XDG_RUNTIME_DIR"
          vulkaninfo --summary
          "$RUNTIME_PYTHON" src/executorch/smoke_test.py \
            --daemon "$module/bin/nozcam_daemon.vulkan.aarch64" \
            --model "$module/models/nozcam-gpu.pte" \
            --timeout 900
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload the verified AArch64 GPU runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pinozcam-runner-gpu-aarch64-${{ github.sha }}
          path: |
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
