name: Build macOS arm64 CPU runtime

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Runtime Wheel version
        required: true
        default: "1.1.0rc11"
        type: string

permissions:
  contents: read

concurrency:
  group: build-macos-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    # macos-14 and later are Apple Silicon. The daemon is arm64 Mach-O and
    # cannot be cross-produced from the Linux runners: macOS has no static
    # libSystem and Apple ld spells the link options differently, which is
    # why this target has its own bootstrap and build script.
    runs-on: macos-14
    timeout-minutes: 120
    env:
      MODEL_WHEEL_URL: https://github.com/DrAlexLiu/OctoPrint-PiNozCam/releases/download/1.1.0rc5/pinozcam_runtime-1.1.0rc5-py3-none-manylinux2014_x86_64.whl
      MODEL_WHEEL_SHA256: 4fb0c81936003043f8db1722adfc65841dd23b29510b5cfe00a082a20dbb6382
      MODEL_SHA256: 1057e47d5341bec038f9f7ccdacd3b01ff6b8eb196a7ae72d3e263d7df013221

    steps:
      - name: Check out PiNozCam
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Report the toolchain
        run: |
          sw_vers
          clang --version | head -1
          cmake --version | head -1

      - name: Build ExecuTorch and the PiNozCam daemon
        run: |
          src/executorch/bootstrap_macos_arm64.sh \
            "$RUNNER_TEMP/pinozcam-macos-build" \
            "$GITHUB_WORKSPACE/runtime-artifacts"

      - name: Fetch the pinned model input
        # The .pte is architecture-independent data, so macOS reuses the
        # exact model every other target ships -- same SHA-256, so any
        # divergence in results cannot be blamed on a different file.
        run: |
          mkdir -p runtime-artifacts/models
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/model-source.whl" "$MODEL_WHEEL_URL"
          echo "$MODEL_WHEEL_SHA256  $RUNNER_TEMP/model-source.whl" \
            | shasum -a 256 --check
          unzip -p "$RUNNER_TEMP/model-source.whl" \
            '*/models/nozcam-cpu.pte' \
            > runtime-artifacts/models/nozcam-cpu.pte
          echo "$MODEL_SHA256  runtime-artifacts/models/nozcam-cpu.pte" \
            | shasum -a 256 --check

      - name: Exercise the production pipe protocol and inference
        run: |
          python3 src/executorch/smoke_test.py \
            --daemon runtime-artifacts/bin/nozcam_daemon.macos.arm64 \
            --model runtime-artifacts/models/nozcam-cpu.pte

      - name: Build the runtime Wheel
        # A virtualenv, not the runner's python3: macOS runners ship
        # Homebrew Python, which is PEP 668 externally-managed and refuses
        # `pip install` into itself. The Linux runners have no such guard,
        # which is why only this target needs the extra step.
        run: |
          python3 -m venv "$RUNNER_TEMP/packaging-venv"
          "$RUNNER_TEMP/packaging-venv/bin/python" -m pip install \
            --disable-pip-version-check --upgrade \
            'setuptools==75.3.2' 'wheel==0.45.1'
          "$RUNNER_TEMP/packaging-venv/bin/python" \
            src/runtime/package_cpu_runtime.py \
            --artifact-root runtime-artifacts \
            --output dist \
            --target macos_arm64 \
            --version "${{ inputs.version }}" \
            --revision "$GITHUB_SHA"

      - name: Verify the installed Wheel payload
        # No check_manylinux here: that asserts a glibc floor, and Mach-O
        # has no glibc. The equivalent claim for this target is "links only
        # libSystem and libc++", which bootstrap_macos_arm64.sh asserts with
        # otool before the Wheel is ever built.
        run: |
          "$RUNNER_TEMP/packaging-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-deps \
            --target "$RUNNER_TEMP/wheel-install" dist/*.whl
          module="$RUNNER_TEMP/wheel-install/pinozcam_runner"
          test -x "$module/bin/nozcam_daemon.macos.arm64"
          test -f "$module/models/nozcam-cpu.pte"
          python3 src/executorch/smoke_test.py \
            --daemon "$module/bin/nozcam_daemon.macos.arm64" \
            --model "$module/models/nozcam-cpu.pte"
          (cd dist && shasum -a 256 --check SHA256SUMS)

      - name: Upload the verified runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pinozcam-runner-macos-arm64-${{ github.sha }}
          path: |
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
