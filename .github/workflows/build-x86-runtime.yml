name: Build x86 CPU runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-x86-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MODEL_WHEEL_URL: https://github.com/DrAlexLiu/OctoPrint-PiNozCam/releases/download/1.1.0rc5/pinozcam_runtime-1.1.0rc5-py3-none-manylinux2014_x86_64.whl
      MODEL_WHEEL_SHA256: 4fb0c81936003043f8db1722adfc65841dd23b29510b5cfe00a082a20dbb6382
      MODEL_SHA256: 1057e47d5341bec038f9f7ccdacd3b01ff6b8eb196a7ae72d3e263d7df013221

    steps:
      - name: Check out PiNozCam
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake git unzip python3-venv

      - name: Build ExecuTorch and PiNozCam daemon
        run: |
          src/executorch/bootstrap_x86.sh \
            "$RUNNER_TEMP/pinozcam-x86-build" \
            "$GITHUB_WORKSPACE/runtime-artifacts"

      - name: Fetch the pinned model input
        run: |
          mkdir -p runtime-artifacts/models
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/model-source.whl" "$MODEL_WHEEL_URL"
          echo "$MODEL_WHEEL_SHA256  $RUNNER_TEMP/model-source.whl" | sha256sum --check
          unzip -p "$RUNNER_TEMP/model-source.whl" \
            '*/models/nozcam-cpu.pte' \
            > runtime-artifacts/models/nozcam-cpu.pte
          echo "$MODEL_SHA256  runtime-artifacts/models/nozcam-cpu.pte" \
            | sha256sum --check

      - name: Exercise the production pipe protocol and inference
        run: |
          python3 src/executorch/smoke_test.py \
            --daemon runtime-artifacts/bin/nozcam_daemon.x86_64.static \
            --model runtime-artifacts/models/nozcam-cpu.pte

      - name: Build the runtime Wheel
        run: |
          python3 -m pip install --disable-pip-version-check --upgrade \
            setuptools wheel
          version="1.1.0rc6.dev${GITHUB_RUN_NUMBER}"
          python3 src/executorch/package_x86_runtime.py \
            --artifact-root runtime-artifacts \
            --output dist \
            --version "$version" \
            --revision "$GITHUB_SHA"

      - name: Verify the installed Wheel payload
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps \
            --target "$RUNNER_TEMP/wheel-install" dist/*.whl
          module="$RUNNER_TEMP/wheel-install/pinozcam_runtime_x86_64"
          test -x "$module/bin/nozcam_daemon.x86_64.static"
          test -f "$module/models/nozcam-cpu.pte"
          python3 src/executorch/smoke_test.py \
            --daemon "$module/bin/nozcam_daemon.x86_64.static" \
            --model "$module/models/nozcam-cpu.pte"
          sha256sum --check dist/SHA256SUMS

      - name: Upload the verified runtime
        uses: actions/upload-artifact@v4
        with:
          name: pinozcam-runtime-x86-${{ github.sha }}
          path: |
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
