name: Build the runtime Wheel release

on:
  push:
    tags:
      - "1.1.0rc*"
      - "1.1.0"
  workflow_dispatch:
    inputs:
      version:
        description: Runtime Wheel version
        required: true
        default: "1.1.0rc12"
        type: string

permissions:
  contents: read

concurrency:
  group: runtime-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpu-x86:
    uses: ./.github/workflows/build-x86-runtime.yml
    with:
      version: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || '1.1.0rc12' }}

  cpu-armhf:
    uses: ./.github/workflows/build-armhf-runtime.yml
    with:
      version: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || '1.1.0rc12' }}

  cpu-macos-arm64:
    uses: ./.github/workflows/build-macos-runtime.yml
    with:
      version: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || '1.1.0rc12' }}

  gpu-aarch64:
    uses: ./.github/workflows/build-gpu-aarch64-runtime.yml
    with:
      version: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || '1.1.0rc12' }}

  gpu-x86:
    uses: ./.github/workflows/build-gpu-x86-runtime.yml
    with:
      version: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || '1.1.0rc12' }}

  rockchip:
    uses: ./.github/workflows/build-rockchip-runtime.yml
    with:
      version: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || '1.1.0rc12' }}

  a733:
    uses: ./.github/workflows/build-a733-runtime.yml
    with:
      version: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || '1.1.0rc12' }}

  t527:
    uses: ./.github/workflows/build-t527-runtime.yml
    with:
      version: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || '1.1.0rc12' }}

  bundle:
    name: Verify and assemble every runtime Wheel
    needs:
      - cpu-x86
      - cpu-armhf
      - cpu-macos-arm64
      - gpu-aarch64
      - gpu-x86
      - rockchip
      - a733
      - t527
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download x86 CPU Wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pinozcam-runner-x86-${{ github.sha }}
          path: build-products/cpu-x86

      - name: Download ARMHF CPU Wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pinozcam-runner-armhf-${{ github.sha }}
          path: build-products/cpu-armhf

      - name: Download macOS arm64 CPU Wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pinozcam-runner-macos-arm64-${{ github.sha }}
          path: build-products/cpu-macos-arm64

      - name: Download AArch64 CPU and GPU Wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pinozcam-runner-gpu-aarch64-${{ github.sha }}
          path: build-products/gpu-aarch64

      - name: Download x86 GPU Wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pinozcam-runner-gpu-x86-64-${{ github.sha }}
          path: build-products/gpu-x86

      - name: Download Rockchip Wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pinozcam-runtime-rockchip-${{ github.sha }}
          path: build-products/rockchip

      - name: Download A733 Wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pinozcam-runtime-a733-${{ github.sha }}
          path: build-products/a733

      - name: Download T527 Wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pinozcam-runtime-t527-${{ github.sha }}
          path: build-products/t527

      - name: Assemble release bundle and unified checksums
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || '1.1.0rc12' }}
        run: |
          python3 src/runtime/assemble_release.py \
            --artifact-root build-products \
            --output release-dist \
            --version "$VERSION" \
            --revision "$GITHUB_SHA"
          (cd release-dist && sha256sum --check --strict CHECKSUMS.txt)

      - name: Upload immutable release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pinozcam-runtime-release-${{ github.sha }}
          path: release-dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  draft-release:
    name: Create draft GitHub pre-release
    if: startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pinozcam-runtime-release-${{ github.sha }}
          path: release-dist

      - name: Create immutable draft release and attach all assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(find release-dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 11
          test -f release-dist/CHECKSUMS.txt
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace its assets" >&2
            exit 1
          fi
          args=(
            "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --draft
            --title "v$RELEASE_TAG"
            --notes "PiNozCam $RELEASE_TAG release candidate."
          )
          if [[ "$RELEASE_TAG" == *rc* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" \
            release-dist/*.whl release-dist/CHECKSUMS.txt
