name: Build x86-64 Vulkan GPU runtime

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Runtime Wheel version
        required: true
        default: "1.1.0rc10"
        type: string

permissions:
  contents: read

concurrency:
  group: build-gpu-x86-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-cpu-fallback:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out PiNozCam
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install CPU build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake git python3-venv

      - name: Build the x86-64 CPU fallback from source
        run: |
          src/executorch/bootstrap_x86.sh \
            "$RUNNER_TEMP/pinozcam-cpu-build" \
            "$GITHUB_WORKSPACE/runtime-artifacts"

      - name: Upload the CPU fallback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pinozcam-gpu-x86-cpu-${{ github.sha }}
          path: runtime-artifacts/bin/nozcam_daemon.x86_64.static
          if-no-files-found: error
          retention-days: 1

  build-vulkan-and-test:
    needs: build-cpu-fallback
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      MODEL_WHEEL_URL: https://github.com/DrAlexLiu/OctoPrint-PiNozCam/releases/download/1.1.0rc5/pinozcam_runtime_jetson_orin-1.1.0rc5-py3-none-manylinux_2_38_aarch64.whl
      MODEL_WHEEL_SHA256: fa5022a37ddc1815ec31604b7a73a38ca491e424fb224504a5e31d3ee00ec052
      CPU_MODEL_SHA256: 1057e47d5341bec038f9f7ccdacd3b01ff6b8eb196a7ae72d3e263d7df013221
      GPU_MODEL_SHA256: 9c5f6d5c2f426e128697e03c87e903d052f9be895b0072a9361691b420b1e181
    steps:
      - name: Check out PiNozCam
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the source-built CPU fallback
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pinozcam-gpu-x86-cpu-${{ github.sha }}
          path: runtime-artifacts/bin

      - name: Install native build and software Vulkan tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            curl \
            file \
            git \
            mesa-vulkan-drivers \
            ninja-build \
            python3-venv \
            unzip \
            vulkan-tools

      - name: Fetch and verify the immutable PTE models
        run: |
          mkdir -p runtime-artifacts/models
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/model-source.whl" "$MODEL_WHEEL_URL"
          echo "$MODEL_WHEEL_SHA256  $RUNNER_TEMP/model-source.whl" \
            | sha256sum --check
          unzip -p "$RUNNER_TEMP/model-source.whl" \
            '*/models/nozcam-cpu.pte' \
            > runtime-artifacts/models/nozcam-cpu.pte
          unzip -p "$RUNNER_TEMP/model-source.whl" \
            '*/models/nozcam-gpu.pte' \
            > runtime-artifacts/models/nozcam-gpu.pte
          echo "$CPU_MODEL_SHA256  runtime-artifacts/models/nozcam-cpu.pte" \
            | sha256sum --check
          echo "$GPU_MODEL_SHA256  runtime-artifacts/models/nozcam-gpu.pte" \
            | sha256sum --check

      - name: Build the x86-64 Vulkan runner from source
        run: |
          chmod 0755 runtime-artifacts/bin/nozcam_daemon.x86_64.static
          src/executorch/bootstrap_vulkan_x86_64.sh \
            "$RUNNER_TEMP/pinozcam-vulkan-build" \
            "$GITHUB_WORKSPACE/runtime-artifacts"

      - name: Audit native ELF payloads
        run: |
          cpu=runtime-artifacts/bin/nozcam_daemon.x86_64.static
          vulkan=runtime-artifacts/bin/nozcam_daemon.vulkan.x86_64
          file "$cpu" "$vulkan"
          file "$cpu" | grep -Eq 'ELF 64-bit LSB.*x86-64.*statically linked'
          file "$vulkan" | grep -Eq 'ELF 64-bit LSB.*x86-64.*dynamically linked'
          test "$(readelf -lW "$cpu" | awk '/GNU_STACK/ {print $7; exit}')" = RW
          test "$(readelf -lW "$vulkan" | awk '/GNU_STACK/ {print $7; exit}')" = RW
          if readelf -dW "$cpu" | grep -q NEEDED; then
            echo "CPU fallback unexpectedly has dynamic dependencies" >&2
            exit 1
          fi
          if ldd "$vulkan" | grep -q 'not found'; then
            echo "Vulkan runner has unresolved shared-library dependencies" >&2
            ldd "$vulkan" >&2
            exit 1
          fi
          readelf -dW "$vulkan" | grep NEEDED

      - name: Build the x86-64 GPU Wheel
        run: |
          python3 -m venv "$RUNNER_TEMP/runtime-package-venv"
          runtime_python="$RUNNER_TEMP/runtime-package-venv/bin/python"
          "$runtime_python" -m pip install --disable-pip-version-check \
            'auditwheel==6.4.2' 'packaging==24.2' \
            'setuptools==75.3.2' 'wheel==0.45.1'
          "$runtime_python" src/runtime/package_accelerator_runtime.py \
            --target vulkan_x86_64 \
            --artifact-root runtime-artifacts \
            --output dist \
            --version "${{ inputs.version }}" \
            --revision "$GITHUB_SHA"
          echo "RUNTIME_PYTHON=$runtime_python" >> "$GITHUB_ENV"

      - name: Verify the installed Wheel and run real PTE inference
        run: |
          shopt -s nullglob
          wheels=(dist/pinozcam_runtime_gpu-*_x86_64.whl)
          test "${#wheels[@]}" -eq 1
          wheel="${wheels[0]}"
          "$RUNTIME_PYTHON" src/runtime/verify_runtime_wheel.py \
            --target vulkan_x86_64 \
            --wheel "$wheel" \
            --revision "$GITHUB_SHA"
          "$RUNTIME_PYTHON" src/runtime/check_manylinux.py \
            --architecture x86_64 --max-glibc-minor 35 "$wheel"
          "$RUNTIME_PYTHON" -m pip install --disable-pip-version-check --no-deps \
            --target "$RUNNER_TEMP/wheel-install" "$wheel"
          module="$RUNNER_TEMP/wheel-install/pinozcam_runner_gpu"
          test -x "$module/bin/nozcam_daemon.x86_64.static"
          test -x "$module/bin/nozcam_daemon.vulkan.x86_64"
          test -f "$module/models/nozcam-cpu.pte"
          test -f "$module/models/nozcam-gpu.pte"
          cmp runtime-artifacts/bin/nozcam_daemon.x86_64.static \
            "$module/bin/nozcam_daemon.x86_64.static"
          cmp runtime-artifacts/bin/nozcam_daemon.vulkan.x86_64 \
            "$module/bin/nozcam_daemon.vulkan.x86_64"

          "$RUNTIME_PYTHON" src/executorch/smoke_test.py \
            --daemon "$module/bin/nozcam_daemon.x86_64.static" \
            --model "$module/models/nozcam-cpu.pte"

          lavapipe_icd=$(find /usr/share/vulkan/icd.d -maxdepth 1 \
            -type f -name 'lvp_icd*.json' -print -quit)
          test -n "$lavapipe_icd"
          export VK_DRIVER_FILES="$lavapipe_icd"
          export VK_ICD_FILENAMES="$lavapipe_icd"
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 0700 "$XDG_RUNTIME_DIR"
          vulkaninfo --summary
          "$RUNTIME_PYTHON" src/executorch/smoke_test.py \
            --daemon "$module/bin/nozcam_daemon.vulkan.x86_64" \
            --model "$module/models/nozcam-gpu.pte" \
            --timeout 900
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload the verified x86-64 GPU runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pinozcam-runner-gpu-x86-64-${{ github.sha }}
          path: |
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
