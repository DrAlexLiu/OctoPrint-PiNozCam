# ⚠️ NOT universal, and not pure-Python either.
#
# `universal = 1` tags the wheel py2.py3-none-any. Both halves are wrong:
# the code is Python 3 only, and setup.py's external runtime dependency is
# selected for this target board. A cached ARM32 dependency decision must not
# masquerade as an architecture-neutral plugin Wheel.
#
# The plugin is distributed as a GitHub source archive. Native bytes live in
# separate pinozcam-runtime-* Wheels with real platform tags; see
# packaging/README.md.
[bdist_wheel]
universal = 0
